substitutions:
  device_name: ha-proxy-panel
  friendly_name: HA Proxy Panel
  display_title: HA PROXY PANEL
  temperature_entity: sensor.your_temperature_sensor
  humidity_entity: sensor.your_humidity_sensor
  display_mode_default: Climate
  display_rotation_default: Normal
  oled_model: SH1106 128x64
  oled_address: "0x3C"
  oled_sda_pin: GPIO21
  oled_scl_pin: GPIO22

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  project:
    name: wikizell.ha-proxy-panel
    version: "1.0.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "HA Proxy Panel Fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  id: display_bus
  sda: ${oled_sda_pin}
  scl: ${oled_scl_pin}
  scan: true
  frequency: 400kHz

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

binary_sensor:
  - platform: status
    id: proxy_status
    name: Status

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: Wi-Fi Signal
    update_interval: 60s

  - platform: uptime
    id: proxy_uptime
    name: Uptime

  - platform: homeassistant
    id: climate_temperature
    entity_id: ${temperature_entity}
    internal: true

  - platform: homeassistant
    id: climate_humidity
    entity_id: ${humidity_entity}
    internal: true

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: IP Address

font:
  - file: "gfonts://Roboto Mono"
    id: font_small
    size: 9

  - file: "gfonts://Roboto Mono"
    id: font_big
    size: 20

select:
  - platform: template
    id: display_content
    name: Display Content
    icon: mdi:monitor-dashboard
    entity_category: config
    options:
      - Climate
      - Temperature
      - Humidity
      - Proxy Status
    initial_option: ${display_mode_default}
    optimistic: true
    restore_value: true

  - platform: template
    id: display_rotation
    name: Display Rotation
    icon: mdi:screen-rotation
    entity_category: config
    options:
      - Normal
      - Rotated 180
    initial_option: ${display_rotation_default}
    optimistic: true
    restore_value: true

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "${oled_model}"
    address: ${oled_address}
    rotation: 0
    update_interval: 5s
    lambda: |-
      // Use the OLED controller for rotation. This avoids a one-column wrap
      // seen on some CH1115 panels when the framebuffer is rotated in software.
      static bool rotation_initialized = false;
      static bool rotation_180 = false;
      const bool requested_rotation_180 =
          id(display_rotation).current_option() == "Rotated 180";
      if (!rotation_initialized || requested_rotation_180 != rotation_180) {
        const uint8_t segment_remap[] = {
            0x00, static_cast<uint8_t>(requested_rotation_180 ? 0xA0 : 0xA1)};
        const uint8_t com_scan[] = {
            0x00, static_cast<uint8_t>(requested_rotation_180 ? 0xC0 : 0xC8)};
        id(display_bus).write(${oled_address}, segment_remap, sizeof(segment_remap));
        id(display_bus).write(${oled_address}, com_scan, sizeof(com_scan));
        rotation_180 = requested_rotation_180;
        rotation_initialized = true;
      }

      // Header and Wi-Fi indicator.
      it.printf(0, 0, id(font_small), "${display_title}");
      if (id(wifi_rssi).has_state()) {
        int wifi_bars = 1;
        if (id(wifi_rssi).state > -75) wifi_bars = 2;
        if (id(wifi_rssi).state > -60) wifi_bars = 3;
        if (id(wifi_rssi).state > -45) wifi_bars = 4;
        for (int i = 0; i < wifi_bars; i++) {
          const int x = 112 + (i * 4);
          const int height = 2 + (i * 2);
          it.filled_rectangle(x, 11 - height, 2, height);
        }
      } else {
        // Leave one clear edge pixel to prevent controller wraparound.
        it.line(113, 3, 125, 10);
        it.line(125, 3, 113, 10);
      }

      it.line(0, 12, 127, 12);

      const std::string mode = id(display_content).current_option();
      if (mode == "Temperature") {
        it.printf(0, 15, id(font_small), "TEMPERATURE");
        if (id(climate_temperature).has_state()) {
          it.printf(18, 24, id(font_big), "%.1f", id(climate_temperature).state);
          it.circle(76, 28, 2);
          it.printf(82, 30, id(font_small), "C");
        } else {
          it.printf(32, 24, id(font_big), "--.-");
        }
      } else if (mode == "Humidity") {
        it.printf(0, 15, id(font_small), "HUMIDITY");
        if (id(climate_humidity).has_state()) {
          it.printf(34, 24, id(font_big), "%.0f%%", id(climate_humidity).state);
        } else {
          it.printf(40, 24, id(font_big), "--%%");
        }
      } else if (mode == "Proxy Status") {
        if (id(wifi_rssi).has_state()) {
          it.printf(0, 15, id(font_small), "WIFI: %.0f dBm", id(wifi_rssi).state);
        } else {
          it.printf(0, 15, id(font_small), "WIFI: -- dBm");
        }
        it.printf(0, 26, id(font_small), "IP: %s", id(ip_address).state.c_str());
        if (id(proxy_uptime).has_state()) {
          it.printf(0, 37, id(font_small), "UP: %.1f hours", id(proxy_uptime).state / 3600.0f);
        }
      } else {
        it.line(64, 14, 64, 47);
        it.printf(0, 14, id(font_small), "T:");
        if (id(climate_temperature).has_state()) {
          it.printf(0, 22, id(font_big), "%.1f", id(climate_temperature).state);
          it.circle(50, 27, 2);
          it.printf(54, 28, id(font_small), "C");
        } else {
          it.printf(0, 22, id(font_big), "--.-");
        }

        it.printf(70, 14, id(font_small), "H:");
        if (id(climate_humidity).has_state()) {
          it.printf(70, 22, id(font_big), "%.0f%%", id(climate_humidity).state);
        } else {
          it.printf(70, 22, id(font_big), "--%%");
        }
      }

      // Footer with proxy and climate-data availability.
      it.line(0, 48, 127, 48);
      it.printf(0, 52, id(font_small), "BT");
      const bool climate_available =
          id(climate_temperature).has_state() || id(climate_humidity).has_state();
      it.printf(15, 52, id(font_small), "PROXY %s DATA %s",
                id(proxy_status).state ? "ON" : "OFF",
                climate_available ? "OK" : "--");

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
