<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Connect HA Proxy Panel</title>
  <style>
    :root{color-scheme:light;--ink:#10243e;--muted:#65758b;--line:#dfe7f0;--blue:#1689e8;--blue2:#0876cf;--pale:#eef7ff;--ok:#12805c;--bad:#b42318;--shadow:0 18px 55px rgba(16,36,62,.1)}
    *{box-sizing:border-box}html{min-height:100%;background:#f5f9fc}body{min-height:100vh;margin:0;padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:grid;place-items:center}
    main{width:100%;max-width:480px;background:#fff;border:1px solid rgba(16,36,62,.08);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
    header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.01em}.mark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:#20b486;box-shadow:0 0 0 4px #e7f8f2}
    .content{padding:28px 22px 22px}h1{margin:0;font-size:30px;line-height:1.12;letter-spacing:-.035em}p{margin:10px 0 24px;color:var(--muted)}
    label,.label{display:block;margin:0 0 7px;font-size:13px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between}.textbtn{appearance:none;border:0;background:none;color:var(--blue2);font:inherit;font-size:13px;font-weight:700;padding:5px 0;cursor:pointer}
    select,input{width:100%;height:50px;border:1px solid #cdd9e6;border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:0 14px;outline:none;transition:.15s border-color,.15s box-shadow}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#60748c 50%),linear-gradient(135deg,#60748c 50%,transparent 50%);background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,137,232,.13)}select:disabled,input:disabled{background-color:#f3f6f9;color:#7f8c9d}
    .field{margin-bottom:19px}.password{position:relative}.password input{padding-right:65px}.show{position:absolute;right:4px;top:4px;height:42px;padding:0 11px}.manual{margin-top:9px}.hidden{display:none!important}
    .primary{width:100%;height:52px;border:0;border-radius:13px;background:var(--blue);color:white;font:inherit;font-weight:750;cursor:pointer;box-shadow:0 8px 20px rgba(22,137,232,.25);transition:.15s transform,.15s background}.primary:hover{background:var(--blue2)}.primary:active{transform:translateY(1px)}.primary:disabled{cursor:wait;opacity:.65}
    .note{display:flex;gap:9px;align-items:flex-start;margin:16px 0 0;font-size:12px;color:var(--muted)}.note svg{flex:0 0 auto;margin-top:2px}.message{margin:0 0 18px;padding:12px 13px;border-radius:11px;background:#fff3f1;color:var(--bad);font-size:13px}.success{text-align:center;padding:9px 0 6px}.check{width:58px;height:58px;margin:0 auto 17px;border-radius:50%;background:#e7f8f2;color:var(--ok);display:grid;place-items:center;font-size:30px;font-weight:800}.success h2{margin:0;font-size:24px}.success p{margin-bottom:0}
    footer{padding:15px 22px;background:#f8fbfd;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;overflow-wrap:anywhere}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:520px){body{padding:0;background:#fff;display:block}main{min-height:100vh;max-width:none;border:0;border-radius:0;box-shadow:none}.content{padding-top:34px}footer{position:fixed;bottom:0;left:0;right:0}.content{padding-bottom:80px}}
    @media(max-width:350px){header,.content{padding-left:17px;padding-right:17px}h1{font-size:27px}.brand{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><span class="mark" aria-hidden="true">⌂</span>HA Proxy Panel</div><div class="status"><span class="dot"></span>Setup mode</div></header>
    <section class="content">
      <div id="formView">
        <h1>Connect your panel</h1>
        <p>Choose your home Wi-Fi and the panel will join Home Assistant automatically.</p>
        <div id="message" class="message hidden" role="alert"></div>
        <form id="wifiForm" action="/wifisave" method="get">
          <div class="field">
            <div class="row"><label for="ssid">Wi-Fi network</label><button id="scan" class="textbtn" type="button">Scan again</button></div>
            <select id="ssid" name="ssid" required><option value="">Scanning nearby networks…</option></select>
            <input id="manual" class="manual hidden" type="text" maxlength="32" autocomplete="off" placeholder="Enter network name" aria-label="Network name">
          </div>
          <div class="field">
            <label for="psk">Password</label>
            <div class="password"><input id="psk" name="psk" type="password" maxlength="64" autocomplete="current-password" placeholder="Wi-Fi password"><button id="show" class="textbtn show" type="button" aria-pressed="false">Show</button></div>
          </div>
          <button id="connect" class="primary" type="submit">Connect panel</button>
        </form>
        <div class="note"><svg width="15" height="17" viewBox="0 0 15 17" fill="none" aria-hidden="true"><rect x="1" y="6" width="13" height="10" rx="3" stroke="currentColor"/><path d="M4 6V4.5a3.5 3.5 0 0 1 7 0V6" stroke="currentColor"/></svg><span>Your password stays on this device.</span></div>
      </div>
      <div id="successView" class="success hidden" role="status"><div class="check">✓</div><h2>Wi-Fi saved</h2><p>The panel is connecting now. You can close this page.</p></div>
    </section>
    <footer>Setup network: <strong>HA Proxy Panel Fallback</strong></footer>
  </main>
  <script>
    const $=id=>document.getElementById(id),select=$('ssid'),manual=$('manual'),message=$('message'),demo=new URLSearchParams(location.search).has('demo');
    function dbm(r){return r>=-55?'Excellent':r>=-67?'Good':r>=-75?'Fair':'Weak'}
    function fail(text){message.textContent=text;message.classList.remove('hidden')}
    async function scan(){message.classList.add('hidden');$('scan').disabled=true;select.disabled=true;select.innerHTML='<option value="">Scanning nearby networks…</option>';try{const data=demo?{aps:[{}, {ssid:'Home Wi-Fi',rssi:-48,lock:1},{ssid:'Home Wi-Fi',rssi:-65,lock:1},{ssid:'Guest network',rssi:-70,lock:0}]}:await fetch('/config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});const seen=new Set(),aps=(data.aps||[]).filter(a=>a.ssid&&!seen.has(a.ssid)&&seen.add(a.ssid)).sort((a,b)=>b.rssi-a.rssi);select.innerHTML='<option value="">Choose a network</option>'+aps.map(a=>`<option value="${esc(a.ssid)}">${esc(a.ssid)} · ${dbm(a.rssi)}${a.lock?' · Secured':''}</option>`).join('')+'<option value="__manual__">Other network…</option>'}catch(e){select.innerHTML='<option value="__manual__">Enter network manually</option>';fail('Networks could not be loaded. You can enter the name manually.')}finally{select.disabled=false;$('scan').disabled=false;syncManual()}}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function syncManual(){const on=select.value==='__manual__';manual.classList.toggle('hidden',!on);manual.required=on;if(on)manual.focus()}
    select.addEventListener('change',syncManual);$('scan').addEventListener('click',scan);$('show').addEventListener('click',()=>{const show=$('psk').type==='password';$('psk').type=show?'text':'password';$('show').textContent=show?'Hide':'Show';$('show').setAttribute('aria-pressed',show)});
    $('wifiForm').addEventListener('submit',async e=>{e.preventDefault();const ssid=select.value==='__manual__'?manual.value.trim():select.value;if(!ssid){fail('Choose a Wi-Fi network first.');return}message.classList.add('hidden');const btn=$('connect');btn.disabled=true;btn.innerHTML='<span class="spin"></span>Saving Wi-Fi…';try{if(!demo){const q=new URLSearchParams({ssid,psk:$('psk').value});const r=await fetch('/wifisave?'+q,{cache:'no-store'});if(!r.ok)throw Error()}$('formView').classList.add('hidden');$('successView').classList.remove('hidden')}catch(err){fail('The settings could not be saved. Please try again.');btn.disabled=false;btn.textContent='Connect panel'}});scan();
  </script>
</body>
</html>
