# Copy this file to secrets.yaml and replace every value before flashing.
wifi_ssid: "CHANGE_ME"
wifi_password: "change-this-password"

# Generate with: openssl rand -base64 32
# This example is valid for configuration checks, but it is public and unsafe.
api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

ota_password: "change-this-ota-password"
fallback_ap_password: "change-this-fallback-password"
# Keep this synchronized with fallback_ap_password. Escape any semicolon,
# comma, colon or backslash in the SSID/password with a backslash.
fallback_ap_qr: "WIFI:T:WPA;S:HA Proxy Panel Fallback;P:change-this-fallback-password;H:false;;"
