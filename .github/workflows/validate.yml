name: Validate firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install desktop GUI dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk

      - name: Validate manager and tests
        run: |
          python -m py_compile tools/ha_proxy_panel_app.py tools/ha_proxy_panel_flasher.py
          python -m unittest discover -s tests -v

  esphome:
    runs-on: ubuntu-latest
    container: ghcr.io/esphome/esphome:stable
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare test secrets
        run: cp firmware/secrets.example.yaml firmware/secrets.yaml

      - name: Validate ESPHome configuration
        run: esphome -s firmware_ref "$GITHUB_SHA" config firmware/ha-proxy-panel.yaml

      - name: Verify published firmware version
        shell: bash
        run: |
          project_version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*"\([0-9.]*\)"/\1/p' firmware/ha-proxy-panel.yaml | head -n1)
          published_version=$(tr -d '\r\n ' < firmware/version.txt)
          test "$project_version" = "$published_version"

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check required website files
        run: |
          test -s docs/index.html
          test -s docs/styles.css
          test -s docs/app.js
          test -s docs/assets/hero-device.png

      - name: Reject accidental private values
        shell: bash
        run: |
          if grep -RIP \
            --exclude='secrets.example.yaml' \
            --exclude='validate.yml' \
            --exclude-dir='.git' \
            '^\s*(?:password|api_encryption_key):\s*(?![!]secret\b)\S+|192\.168\.(?!4\.1\b)[0-9]+\.[0-9]+' .; then
            echo "Potential private value found"
            exit 1
          fi
